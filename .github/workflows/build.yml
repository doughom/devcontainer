---
name: Build

on:
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/build.yml
      - kit/**
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [devcontainer, pi]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .devcontainer/
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64

  sandbox:
    name: Validate sandbox kit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Docker Sandbox
        run: |
          sudo cp .github/apt/docker.asc /etc/apt/keyrings/
          sudo cp .github/apt/docker.sources /etc/apt/sources.list.d/
          sudo apt install --update --yes --no-install-recommends docker-sbx

      - name: Validate
        run: sbx kit validate ./kit
