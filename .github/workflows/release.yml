---
name: Release

on:
  push:
    paths:
      - .devcontainer/**
    branches:
      - main

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [devcontainer, pi]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Install Docker Sandbox
        run: |
          sudo cp .github/apt/docker.asc /etc/apt/keyrings/
          sudo cp .github/apt/docker.sources /etc/apt/sources.list.d/
          sudo apt install --update --yes --no-install-recommends docker-sbx

      - name: Get Tag
        id: tag
        run: |
          case ${{ matrix.target }} in
            devcontainer) echo tag=latest;;
            *) echo tag=${{ matrix.target }};; 
          esac >> "$GITHUB_OUTPUT"

      - name: GHCR Login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Dev Container Image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        id: push
        with:
          context: .devcontainer/
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}

      - name: Push sandbox kit
        run: sbx kit push ./kit ghcr.io/${{ github.repository }}:kit

      - name: Add Image Attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
