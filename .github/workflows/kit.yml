---
name: Release sandbox kit

on:
  push:
    paths:
      - kit/**
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Release sandbox kit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Install Docker Sandbox
        run: |
          sudo cp .github/apt/docker.asc /etc/apt/keyrings/
          sudo cp .github/apt/docker.sources /etc/apt/sources.list.d/
          sudo apt install --update --yes --no-install-recommends docker-sbx

      - name: GHCR Login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push sandbox kit
        run: sbx kit push ./kit ghcr.io/${{ github.repository }}:pi-sandbox
